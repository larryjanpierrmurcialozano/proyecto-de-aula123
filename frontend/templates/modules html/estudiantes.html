<div class="card">
    <div class="card-header-flex">
        <h2 class="card-title" style="border:none;margin:0;padding:0;">
            <i class="fas fa-user-graduate"></i> Gestión de Estudiantes
        </h2>
        <button class="btn btn-verde" onclick="abrirModalEstudiante()">
            <i class="fas fa-plus"></i> Nuevo Estudiante
        </button>
    </div>
    <div class="filtros-container">
        <div class="busqueda-box">
            <i class="fas fa-search"></i>
            <input type="text" id="filtro-estudiante-buscar" placeholder="Buscar por nombre, apellido o documento">
        </div>
        <select class="filtro-select" id="filtro-estudiante-grado">
            <option value="">Todos los grados</option>
        </select>
        <select class="filtro-select" id="filtro-estudiante-grupo">
            <option value="">Todos los grupos</option>
        </select>
        <select class="filtro-select" id="filtro-estudiante-estado">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>
    </div>
    <div class="tabla-container tabla-estudiantes-container">
        <table class="tabla-estudiantes">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Documento</th>
                    <th>Nombre Completo</th>
                    <th>Grado / Grupo</th>
                    <th>Acudiente</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-estudiantes"></tbody>
        </table>
    </div>
    <div class="estudiantes-paginacion-flotante" id="estudiantes-paginacion-flotante" style="display:none;">
        <button type="button" class="estudiantes-paginacion-toggle" onclick="alternarPaginacionEstudiantes()"
                aria-label="Mostrar controles de estudiantes">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="estudiantes-paginacion-controles">
            <button type="button" class="estudiantes-paginacion-control" id="estudiantes-pagina-anterior"
                    onclick="cambiarPaginaEstudiantes(ESTUDIANTES_PAGINA_ACTUAL - 1)">
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <span id="estudiantes-paginacion-info"></span>
            <button type="button" class="estudiantes-paginacion-control" id="estudiantes-pagina-siguiente"
                    onclick="cargarSiguientePaginaEstudiantes()">
                Siguiente <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>
